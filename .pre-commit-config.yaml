# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff-check
        args: [ --fix, --exit-non-zero-on-fix ]
  - repo: https://github.com/psf/black
    rev: "26.10.1"
    hooks:
    - id: black
      language_version: python3.14
  - repo: https://github.com/astral-sh/uv-pre-commit
    # uv version.
    rev: "0.13.0"
    hooks:
      - id: uv-lock
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: "v0.49.1"
    hooks:
      - id: markdownlint
        args: ["-f"]
        exclude: ^sites_conformes/static/
  - repo: https://github.com/PyCQA/bandit
    rev: '1.9.4'
    hooks:
    - id: bandit
      exclude: '(^|/)(tests|migrations)/|^demo/'
  - repo: https://github.com/gitleaks/gitleaks
    rev: "v8.30.1"
    hooks:
    - id: gitleaks
  - repo: local
    hooks:
    - id: forbid-db-dumps
      name: Forbid database dumps and backups
      language: fail
      entry: "Database dumps and backups must not be committed"
      files: '\.(sql|dump|pgdump)(\.gz)?$|(^|/)backup_[^/]*$'
      exclude: '^scripts/backup_local\.sh$'
