name: 🍪 CI - Vendored TarteAuCitron Check

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - "package-lock.json"
      - ".github/workflows/ci-check-tarteaucitron.yml"
      - "scripts/sync_tarteaucitron.sh"

jobs:
  build:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 📔 Install just
        uses: extractions/setup-just@v2
      - name: 📦 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: 🍪 Check vendored tarteaucitronjs is up to date
        run: |
          just sync-tarteaucitron
          git diff --exit-code sites_conformes/static/lib/tarteaucitronjs/
