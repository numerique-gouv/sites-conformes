name: 🔮 CI - Main checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: config.settings_test
    strategy:
      matrix:
        # Only include the first and last supported Python versions, as well as
        # the one that is pinned in the .python-version file
        # (which should be the default one on Scalingo, per
        # https://doc.scalingo.com/languages/python/start )
        python-version: ["3.12", "3.13", "3.14"]
        # Only include the first and last supported pgsql versions to limit
        # the number of jobs
        postgresql-version: [14, 17]
    services:
      postgres:
        image: postgres:${{ matrix.postgresql-version }}-alpine
        env:
          POSTGRES_USER: dju
          POSTGRES_PASSWORD: djpwd
          POSTGRES_DB: djdb
          POSTGRESQL_VERSION: ${{ matrix.postgresql-version }}
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v7
      - name: 📔 Install just
        uses: extractions/setup-just@v4
      - name: 🐍 Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: 📦 Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext
      - name: 🐍 Set up uv
        uses: astral-sh/setup-uv@v10.3.0
      - name: 🌍 Install dependencies
        run: |
          uv sync --no-group dev
      - name: 📄 Copy empty .env.test to .env
        run: |
          cp .env.test .env
      - name: 🌍 Compile translation files
        run: |
          just compilemessages
      - name: 💾 Collect static files
        run: |
          just collectstatic
      - name: 🤹‍ Run the unit tests
        run: |
          just unittest
      - name: 🎨 Deploy starter content
        run: |
          just init
          uv run python manage.py create_demo_pages

  integration-s3:
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: config.settings_s3_test
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dju
          POSTGRES_PASSWORD: djpwd
          POSTGRES_DB: djdb
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v7
      - name: 🐍 Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: 🐍 Set up uv
        uses: astral-sh/setup-uv@v10.3.0
      - name: 🌍 Install dependencies
        run: |
          uv sync --no-group dev
      - name: 📄 Copy empty .env.test to .env
        run: |
          cp .env.test .env
      - name: 🐳 Start Garage cluster
        env:
          # compose interpolates the whole file, including the web service ports
          HOST_PORT: 8000
        run: |
          docker compose --profile s3 up -d garage
          timeout 30 sh -c 'until nc -z localhost 3900; do sleep 1; done'
          docker compose --profile s3 logs garage
      - name: 🤹‍ Run S3 integration tests
        env:
          GARAGE_INTEGRATION_TESTS: "1"
          S3_HOST: localhost:3900
          S3_KEY_ID: GKarageKEY00000000000000000
          S3_KEY_SECRET: GKarageSECRETe1087f810d44b283bd7a61077c363893
          S3_BUCKET_NAME: sites-conformes-media
          S3_BUCKET_REGION: fr
          S3_PROTOCOL: http
        run: |
          uv run python manage.py test \
            sites_conformes.core.tests.test_s3_integration
