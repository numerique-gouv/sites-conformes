<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title desc">
  <title id="title">Jupiter : déclarations acceptées sans photographie</title>
  <desc id="desc">La planète Jupiter et ses bandes nuageuses, entourée d’éclairs d’orage. À côté, un appareil photo barré : la photographie n’est pas exigée.</desc>
  <rect width="400" height="300" fill="#f5f5fe"/>
  <defs>
    <clipPath id="jupiter">
      <circle cx="140" cy="155" r="100"/>
    </clipPath>
  </defs>
  <!-- Jupiter and its bands -->
  <g clip-path="url(#jupiter)">
    <rect x="40" y="55" width="200" height="200" fill="#e8d2b0"/>
    <rect x="40" y="80" width="200" height="22" fill="#c99a6b"/>
    <rect x="40" y="120" width="200" height="14" fill="#b5835a"/>
    <rect x="40" y="160" width="200" height="26" fill="#c99a6b"/>
    <rect x="40" y="205" width="200" height="12" fill="#b5835a"/>
    <ellipse cx="175" cy="173" rx="26" ry="13" fill="#c1502e"/>
  </g>
  <circle cx="140" cy="155" r="100" fill="none" stroke="#7a5230" stroke-width="2"/>
  <!-- Storm lightning -->
  <g fill="#ffd100" stroke="#161616" stroke-width="2" stroke-linejoin="round">
    <polygon points="60,40 40,78 56,78 44,108 78,64 61,64 74,40"/>
    <polygon points="235,60 218,92 232,92 222,118 250,80 236,80 247,60"/>
    <polygon points="95,232 80,258 92,258 84,280 108,250 96,250 105,232"/>
  </g>
  <!-- Crossed-out camera -->
  <g transform="translate(270 105)">
    <rect x="0" y="18" width="100" height="66" rx="8" fill="#ffffff" stroke="#161616" stroke-width="3"/>
    <rect x="30" y="6" width="36" height="14" rx="3" fill="#ffffff" stroke="#161616" stroke-width="3"/>
    <circle cx="50" cy="51" r="20" fill="#e3e3fd" stroke="#161616" stroke-width="3"/>
    <circle cx="50" cy="51" r="8" fill="#000091"/>
    <line x1="-8" y1="96" x2="108" y2="0" stroke="#e1000f" stroke-width="7" stroke-linecap="round"/>
  </g>
  <text x="320" y="230" text-anchor="middle" font-family="Marianne, Arial, sans-serif" font-size="15" font-weight="bold" fill="#161616">Sans photo</text>
</svg>
